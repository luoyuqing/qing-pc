name: Qing PC Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - element
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      # 不用 pnpm/action-setup：它把 pnpm 放在临时目录，
      # 而上游的 git 依赖（matrix-js-sdk#develop）安装时会 fork 出
      # `pnpm build` 子进程，在 %TEMP% 下找不到该可执行文件。
      # 全局装到 %APPDATA%\npm 才能被子进程解析到。
      - name: Setup pnpm
        shell: pwsh
        run: |
          npm i -g pnpm@12 --no-fund --no-audit
          pnpm --version

      # 上游 allowBuilds 白名单只有 matrix-js-sdk / @sentry/cli / nx：
      #   - matrix-js-sdk 是 git 依赖，pnpm 会展开成超长目录后跑 `pnpm build`，
      #     Windows 上 cmd 进不去该目录（The system cannot find the path specified）；
      #     webpack 的 alias 直接指向它的 src，本来也不需要构建产物，跳过即可。
      #   - @sentry/cli 与 nx 的构建本就不需要（上游也标注了 false）。
      # 根 postinstall（scripts/pnpm-link.ts）负责链接 workspace 包，需手动补回。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Link workspace packages
        run: node scripts/pnpm-link.ts

      # nx 的 native task hasher 在 Windows 上会因非 UTF-8 字节直接崩溃，
      # 这里显式按依赖顺序构建，绕过 nx。
      - name: Build workspace packages
        shell: bash
        run: |
          set -e
          (cd packages/module-api && pnpm exec vite build)
          (cd packages/shared-utils && pnpm exec vite build)
          (cd packages/shared-components && pnpm exec vite build)

      - name: Build web app
        shell: bash
        run: |
          set -e
          cd apps/web
          # webpack 不做 clean，残留的旧 bundle 会被一起打进包里（体积翻倍），必须先清
          rm -rf webapp
          pnpm run rethemendex
          pnpm exec webpack-cli --mode production
          ls webapp/bundles

      - name: Pack webapp.asar
        shell: bash
        run: |
          set -e
          # Element Desktop 从 webapp.asar 根目录读 config.json，
          # 缺失会直接报 "no default server specified" 并停在错误页。
          cp apps/web/qing.config.json apps/web/webapp/config.json
          rm -rf apps/desktop/webapp
          rm -f apps/desktop/webapp.asar
          cp -r apps/web/webapp apps/desktop/webapp
          cd apps/desktop
          pnpm exec asar p webapp webapp.asar
          pnpm exec asar list webapp.asar | grep -q "config.json" || { echo "config.json 未打入 webapp.asar"; exit 1; }
          pnpm exec asar extract-file webapp.asar config.json
          node -e "const c=require('./config.json');console.log('brand:',c.brand,'| homeserver:',c.default_server_config['m.homeserver'].base_url);require('fs').unlinkSync('config.json')"
          ls -lh webapp.asar

      - name: Build desktop main process
        shell: bash
        run: |
          set -e
          cd apps/desktop
          pnpm exec tsc
          node scripts/copy-res.ts

      - name: Package Windows zip
        shell: bash
        run: |
          set -e
          cd apps/desktop
          # 清掉上一次的产物，确保 zip 里只有本次构建
          rm -rf dist
          CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --win zip --x64 --publish never
          mkdir -p ../../out
          cp dist/*.zip ../../out/
          cd ../../out
          sha256sum *.zip | tee SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Qing-PC-Windows
          path: out/*
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: false
