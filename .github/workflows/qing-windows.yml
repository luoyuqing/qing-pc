name: Qing Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Native build tools
        shell: pwsh
        run: |
          choco install nasm nuget.commandline -y --no-progress
          "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - name: Read Flutter version
        shell: pwsh
        run: |
          $version = (Get-Content .fvmrc -Raw | ConvertFrom-Json).flutter
          "FLUTTER_VERSION=$version" >> $env:GITHUB_ENV
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter test test/service_gateway_config_test.dart test/qing_desktop_shell_test.dart test/desktop_files_test.dart
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Qing-Windows-x64
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
